name: Keep Alive Supabase

# Respaldo automático: hace ping a las 4 bases de datos aunque nadie
# abra la app. Supabase pausa proyectos free tras 7 días sin actividad,
# pero según su propia documentación necesita "unas pocas peticiones
# cada día durante la semana previa" para no pausar — un ping cada 3
# días no siempre alcanza. Por eso corremos 3 veces al día.
on:
  schedule:
    - cron: '0 4,12,20 * * *'   # 04:00, 12:00 y 20:00 UTC (hora CR: 22:00, 06:00, 14:00) todos los días
  workflow_dispatch: {}          # permite correrlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Listerfy
        run: |
          curl -sf -X POST "https://onbexzwvbnumwuawesuu.supabase.co/rest/v1/keep_alive_pings" \
            -H "apikey: sb_publishable_ez03kD82qJwruoL1Pojxhw_v8pSLdlR" \
            -H "Authorization: Bearer sb_publishable_ez03kD82qJwruoL1Pojxhw_v8pSLdlR" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"source":"github-action"}'

